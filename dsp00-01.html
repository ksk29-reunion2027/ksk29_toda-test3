<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>2027年同窓会の概要</title>
    <script>

        // =========================
        // デバッグフラグ
        // 1: 認証スキップ
        // 0: 通常認証
        // =========================

        const DEBUG_MODE = 1;
        // =========================
        // 認証チェック
        // =========================
        if (!DEBUG_MODE) {
            if (sessionStorage.getItem("auth") !== "ok") {
                window.location.href = "index.html";
            }
        }

    </script>

    <style>

        body {

            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #f4f4f4;
            /* 背景画像 */
            background-image: url('image/back04.png');
        }

        .header {

            background-color: #2d6cdf;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;

        }

        .container {

            padding: 10px;

        }

        .pdf-area {

            width: 100%;
            height: 80vh;
            border: none;
            background-color: white;

        }

        .button {

            display: block;
            width: 100%;
            box-sizing: border-box;
            text-decoration: none;
            background-color: #2d6cdf;
            color: white;
            padding: 16px;
            margin-top: 15px;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            font-weight: bold;

        }

        .button:hover {
            background-color: #1f56b5;
        }

        .note {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
            text-align: center;

        }

    </style>

</head>

<body>

    <div class="header">
        2027年同窓会の概要
    </div>

    <div class="container">

        <!-- PDF表示 -->
 
        <iframe
            class="pdf-area"
            src="udata/reuni_announce.pdf">
        </iframe>

        <!-- PDF直接表示できない場合 -->

        <a
            class="button"
            href="udata/reuni_announce.pdf"
            target="_blank">

            PDFを別画面で開く

        </a>

        <!-- 戻る -->

        <a
            class="button"
            href="home00.html">

            メニューへ戻る

        </a>

        <div class="note">

            PDFが表示されない場合は
            「PDFを別画面で開く」をご利用ください。

        </div>

    </div>

</body>
</html>
