<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
現在の申込状況
</title>

<style>

body{

    font-family: sans-serif;
    margin: 0;
    padding: 15px;
    background-color: #f5f5f5;
    /* 背景画像 */
    background-image: url('image/back04.png');
    

}

.container{

    max-width: 900px;
    margin: auto;

}

h1{
    text-align: center;
    margin-bottom: 25px;
}

.section{
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 25px;
}

label{
    font-weight: bold;
}

select{
    width: 100%;
    padding: 12px;
    font-size: 18px;
    margin-top: 10px;
    margin-bottom: 15px;
}
/* ｐｃ　*/
    iframe{
        width: 100%;
        height: 700px; 
        border: none;
        background: white;
    }
/* タブレット　*/    
@media screen and (max-width: 1024px){
font-size: 16px;
    iframe{
        width: 120%;
        height:  80px;

        transform: scale(0.85);
        transform-origin: top left;

        border: none;
        background: white;
    }
}
/* スマホ　*/    
@media screen and (max-width: 600px){
font-size: 14px;
    iframe{
        width: 160%;
        height:  900px;

        transform: scale(0.62);
        transform-origin: top left;

        border: none;
        background: white;
    }
}    
#overallFrame{

    height: 600px;

}

#classFrame{

    height: 600px;

}

.note{

    font-size: 14px;
    color: #666666;
    margin-top: 10px;

}
/* 追加0510
戻るボタンのスタイル */
.back-button-wrapper{

    text-align: center;
    margin-bottom: 30px;

}

/* 追加0510 */
.back-button{

    display: inline-block;
    padding: 12px 40px;
    font-size: 16px;
    font-weight: bold;
    color: white;
    background-color: #555555;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;

}

/* 追加0510 */
.back-button:hover{
    background-color: #333333;
}
    
</style>
</head>

    <h1>
        現在の申込状況
    </h1>

    <!-- 全体集計 -->

    <div class="section">

        <h2>
            全体集計
        </h2>

        <iframe
            id="overallFrame"
            src=""
        ></iframe>

    </div>

    <!-- 組別表示 -->

    <div class="section">

        <h2>
            組別申込状況
        </h2>

        <label for="classSelect">

            表示する組を選択してください

        </label>

        <select id="classSelect">

            <option value="01">
                1組
            </option>
            <option value="02">
                2組
            </option>
            <option value="03">
                3組
            </option>
            <option value="04">
                4組
            </option>
            <option value="05">
                5組
            </option>
            <option value="06">
                6組
            </option>
            <option value="07">
                7組
            </option>
            <option value="08">
                8組
            </option>
            <option value="09">
                9組
            </option>
            <option value="10">
                10組
            </option>
        </select>
        <iframe
            id="classFrame"
            src=""
        ></iframe>

        <div class="note">

            ※ 内容は自動更新されます

        </div>

    </div>
   <!-- 追加0510
    戻るボタン -->
    <div class="back-button-wrapper">

        <!-- 追加0510 -->
        <button
            class="back-button"
            onclick="history.back()"
        >
            ← 戻る
        </button>

    </div>
</div>
