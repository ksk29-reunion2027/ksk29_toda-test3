<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>岸和田高校29期 同窓会</title>
  
    <script>

        // =========================
        // デバッグフラグ
        // =========================
        const DEBUG_MODE = 0;

        // =========================
        // 20260526　機能追加
        // 提供モード
        //
        // 1 : 第一段階提供
        // 2 : 第二段階提供
        // =========================
        const PROV_MODE = 1;

        // =========================
        // 20260526　機能追加
        // GoogleフォームURL
        // =========================

        // 第一段階提供用
        const FORM_URL_STAGE1 =
            "https://forms.gle/C7HhkWAHuc6sMY5VA";
        
        // 第二段階提供用
        const FORM_URL_STAGE2 =
            "https://forms.gle/e43hUmGsxfqvj6bv6";
            // ↑ 最終申し込み用URLへ変更

        if(DEBUG_MODE !== 1) {

            if (sessionStorage.getItem("auth") !== "ok") {
                window.location.href = "index.html";
            }
        }

        // ログアウト
        function logout() {

            sessionStorage.removeItem("auth");
            window.location.href = "index.html";
        }

        // =========================
        // 新着情報 読み込み
        // =========================
        async function loadNews() {

            const area = document.getElementById("newsArea");

            try {

                // キャッシュ回避用 ?t=
                const response = await fetch(
                    "udata/newdata.txt?t=" + new Date().getTime()
                );

                if (!response.ok) {
                    throw new Error("読込失敗");
                }

                const text = await response.text();

                // 改行を <br> に変換
                area.innerHTML = text.replace(/\n/g, "<br>");

            } catch(error) {

                area.innerHTML =
                    "現在、新着情報を取得できません。";
            }
        }

        // =========================
        // 20260526　機能追加
        // ２番メニュー切替
        // =========================
        function setupMenu02() {

            const menu02 =
                document.getElementById("menu02");

            // =========================
            // 第一段階提供
            // =========================
            if(PROV_MODE === 1) {

                menu02.href =
                    FORM_URL_STAGE1;

                menu02.target =
                    "_blank";

                menu02.rel =
                    "noopener noreferrer";

                menu02.innerHTML = `
                    ２．同窓会への参加　仮申し込み<br>
                    （ホテル人数キャパ確認用）<br>
                    受付中～26年8月31日まで
                `;
            }

            // =========================
            // 第二段階提供
            // =========================
            else if(PROV_MODE === 2) {

                menu02.href =
                    FORM_URL_STAGE2;

                menu02.target =
                    "_blank";

                menu02.rel =
                    "noopener noreferrer";

                menu02.innerHTML = `
                    ２．同窓会への参加　最終申し込み<br>
                    <br>
                    受付中～27年■月■日まで
                `;
            }
        }

        // =========================
        // ページ読込後
        // =========================
        window.addEventListener(
            "DOMContentLoaded",
            function() {

                loadNews();

                // =========================
                // 20260526　機能追加
                // =========================
                setupMenu02();
            }
        );

    </script>

    <style>

        body {

            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #f4f4f4;
            color: #333;

            background-image: url('image/back04.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
        }

        .container {

            max-width: 480px;
            margin: auto;
            padding: 20px;
        }

        h1 {

            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: #ffffff;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
        }

        .greeting {

            position: relative;
            background-color: rgba(255,255,255,0.88);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            line-height: 1.8;
            overflow: hidden;
        }

        .greeting::before {

            content: "";
            position: absolute;

            top: 50%;
            left: 50%;

            width: 220px;
            height: 220px;

            transform: translate(-50%, -50%);

            background-image: url('image/ksk.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 180px;

            opacity: 0.35;
            z-index: 0;
        }

        .greeting * {

            position: relative;
            z-index: 1;
        }

        /* ========================= */
        /* 新着情報ボックス */
        /* ========================= */
        .news-box {

            background-color: rgba(255,255,255,0.92);
            border-left: 6px solid #e53935;

            padding: 16px;
            margin-bottom: 25px;

            border-radius: 12px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .news-title {

            font-size: 18px;
            font-weight: bold;

            margin-bottom: 10px;

            color: #d32f2f;
        }

        .news-content {

            font-size: 15px;
            line-height: 1.7;

            white-space: normal;
        }

        .menu-button {

            display: block;
            width: 100%;
            box-sizing: border-box;

            text-decoration: none;

            background-color: #2d6cdf;
            color: white;

            padding: 18px;
            margin-bottom: 18px;

            border-radius: 12px;

            font-size: 18px;
            text-align: center;
            font-weight: bold;

            box-shadow: 0 2px 5px rgba(0,0,0,0.15);

            white-space: normal;
            line-height: 1.6;
            height: auto;
            overflow: visible;
        }

        .menu-button:hover {

            background-color: #1f56b5;
        }

        .logout-button {

            display: block;
            width: 100%;
            box-sizing: border-box;

            background-color: #888;
            color: white;

            padding: 14px;
            margin-top: 30px;

            border: none;
            border-radius: 12px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .logout-button:hover {

            background-color: #666;
        }

        .footer {

            margin-top: 30px;
            text-align: center;

            font-size: 14px;

            color: #ffffff;

            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        }

    </style>

</head>
  
<body>

    <div class="container">

        <h1>岸和田高校29期 同窓会</h1>

        <div class="greeting">

            <p>皆さま、お元気でしょうか。</p>

            <p>
                2027年開催予定の同窓会に向け、
                情報共有用ホームページを開設いたしました。
            </p>

            <p>
                開催概要、参加申込、現在の申込状況などを
                随時掲載してまいります。
            </p>

            <p>是非ご活用ください。</p>

        </div>

        <!-- ========================= -->
        <!-- 新着情報 -->
        <!-- ========================= -->
        <div class="news-box">

            <div class="news-title">
                ■ 新着情報
            </div>

            <div id="newsArea" class="news-content">

                読み込み中...

            </div>

        </div>

        <a href="dsp00-01.html" class="menu-button">

            １．2027年同窓会の概要

        </a>

        <!-- ========================= -->
        <!-- 20260526　機能追加 -->
        <!-- ２番メニューはJSで切替 -->
        <!-- ========================= -->
        <a
            id="menu02"
            href="#"
            class="menu-button">

            読み込み中...

        </a>

        <a href="dsp00-03.html" class="menu-button">

            ３．現在の申込状況の確認

        </a>

        <button class="logout-button" onclick="logout()">

            ログアウト

        </button>

        <div class="footer">

            Kishiwada High School 29th Reunion

        </div>

    </div>

</body>
</html>
