    <title>岸和田高校 29期 同窓会ホームページ</title>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f5f5f5;

            /* 背景画像の指定 */
                background-image: url('image/back04.png');
            /* 画像の繰り返しを防ぐ */
                background-repeat: no-repeat;
            /* 画像を中央に配置 */
                background-position: center center;
            /* 画面全体にフィットさせる（重要） */
                background-size: cover;
            /* スクロールしても背景を固定 */
                background-attachment: fixed;
        }

        .login-box {
            position: relative;
            background: white;
            width: 300px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        /*  背景画像　追加 */
          .login-box::before {
        
            content: "";
            position: absolute;
        
            top: 50%;
            left: 50%;
        
            width: 180px;
            height: 180px;
        
            transform: translate(-50%, -50%);
            background-image: url('image/ksk.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.35;
            z-index: 0;
        }

/* 文字を前面へ */
        .login-box * {
            position: relative;
            z-index: 1;
        }





/*  --------------------------------   */          
        h1 {
            color: #333;
            margin-bottom: 30px;

            font-family:
            'Shippori Mincho',
            serif;
            font-size: 34px;
            text-align: center;
            line-height: 1.2;
            color: #222;
        }

        input {
            width: 90%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            color: red;
            font-weight: bold;
        }

        #success {
            color: green;
            font-weight: bold;
        }
      #message {
          margin-top: 15px;
          color: red;
          font-weight: bold;
      }

      #debug{
          margin-top:20px;
          color:blue;
          font-size:14px;
          white-space:pre-wrap;
      }

           
        }
    </style>
</head>

<body>

   <div id="debug"></div>
      
   <div class="login-box">

        <h1> 岸和田高校 </h1>
        <h1>  （第29期同窓会）</h1>
        
        <p>パスワードを入力してください</p>
        <input type="password" id="password" placeholder="パスワード">
        <br>
        <button onclick="checkPassword()">ログイン</button>
        <div id="message"></div>

    </div>

   




   
    <script>

       function dbg(text){
          document.getElementById("debug").innerHTML +=
          text + "<br>";
      }
       

       
       // "xxx" の SHA-256 ハッシュ値
      const PASSWORD_HASH = "8cf48579590198347877319666b32e77a4c862a89ad57bf8734f9d991f30897c";
      //
      // SHA-256 生成
      //
        async function sha256(text) {
      
        const msgUint8 = new TextEncoder().encode(text);
        const hashBuffer =
          await crypto.subtle.digest('SHA-256', msgUint8);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray
          .map(b => b.toString(16).padStart(2, '0'))
          .join('');
      }
      //
      // パスワードチェック
      // 
       async function checkPassword() {

        const pw = document.getElementById("password").value;
        const message = document.getElementById("message"); 
        const hash = await sha256(pw);

 // dbg("入力値pw=" + pw  + "/");
 // dbg("入力値hash=" + hash);         
          
         if(  pw == "" ) { 
                message.innerHTML = "パスワードを入力してください!";
                message.style.color = "red";
         }else if(hash === PASSWORD_HASH){
          // 認証OK時,次画面へ移動
            sessionStorage.setItem("auth", "ok");
            window.location.href = "home00.html";
        } else {
                message.innerHTML = "パスワードが違います!";
                message.style.color = "red";
        }
      }

       
      /*  -----------20260521 コメントアウト  */
     </script>

</body>
