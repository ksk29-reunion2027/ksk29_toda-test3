<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岸和田高校 29期 同窓会ホームページ</title>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f5f5f5;

            /* 背景画像の指定 */
                background-image: url('image/back04.png');
            /* 画像の繰り返しを防ぐ */
                background-repeat: no-repeat;
            /* 画像を中央に配置 */
                background-position: center center;
            /* 画面全体にフィットさせる（重要） */
                background-size: cover;
            /* スクロールしても背景を固定 */
                background-attachment: fixed;
        }

        .login-box {
            position: relative;
            background: white;
            width: 300px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        /*  背景画像　追加 */
          .login-box::before {
        
            content: "";
            position: absolute;
        
            top: 50%;
            left: 50%;
        
            width: 180px;
            height: 180px;
        
            transform: translate(-50%, -50%);
            background-image: url('image/ksk.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.35;
            z-index: 0;
        }

/* 文字を前面へ */
        .login-box * {
            position: relative;
            z-index: 1;
        }





/*  --------------------------------   */          
        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        input {
            width: 90%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            color: red;
            font-weight: bold;
        }

        #success {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1> 　岸和田高校　 </h1>
        <h1> ー２９期同窓会ー</h1>
        
        <p>パスワードを入力してください</p>
        <input type="password" id="password" placeholder="パスワード">
        <br>
        <button onclick="checkPassword()">ログイン</button>
        <div id="message"></div>

    </div>

    <script>
        function checkPassword() {
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");
            if (password === "") {
                message.innerHTML = "パスワードを入力してください";
                message.style.color = "red";
            } else if (password === "ksk29") {
            // 次画面へ移動
            sessionStorage.setItem("auth", "ok");
            window.location.href = "home00.html";
              /*  message.innerHTML = "認証成功"; */
              /*  message.style.color = "green"; */
            } else {
                message.innerHTML = "パスワードが違います";
                message.style.color = "red";
            }
        }
    </script>

</body>
</html>
